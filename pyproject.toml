[project]
name = "superapp"
version = "0.1.0"
description = "A Muse-style personal agent runtime: persistent memory, skills, subagents, browser tasks, scheduled work."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "pyyaml>=6",
  "rich>=13",
  "python-dotenv>=1",
]

[project.optional-dependencies]
memory = ["qdrant-client>=1.9", "fastembed>=0.3", "onnxruntime"]
db = ["psycopg[binary]>=3.1"]
browser = ["playwright>=1.45"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12", "httpx>=0.27", "cryptography>=42",
          "croniter>=2", "psycopg[binary]>=3.1", "psycopg_pool>=3.2", "h2>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["superapp*"]
