# Prompt assembly manifest. Each role is an ordered list of entries:
#   - a block path under superapp/prompts/blocks (verbatim Muse text, placeholders filled)
#   - "$name" for a section computed at assembly time (see assembler.py: SECTIONS)
# Blocks reconstructed from Muse are not edited; ordering here follows the
# documented context assembly: identity -> environment -> standing files ->
# memory -> tools -> work mechanics -> safety/security -> time -> context -> style.

