# bin-scopes.conf -- per-channel allowlist for CHANNEL-SCOPED companion BINARIES.
#
# INDEPENDENT of skills: this file alone governs which extension-CLI binaries are
# gated. It is not tied to skill gating or to any skill's visibility. The
# UNION of every binary listed across all channel lines below is the GATED SET --
# those binaries are carved out of the cell's /opt/hatch/bin at build and staged
# host-only under /opt/hatch/bin-scoped/<binary>. One line per CD channel
# (a channel MAY also span multiple lines; both the build planner and
# launch-daemon.sh union all of a channel's lines, so entries accumulate):
#
#     <channel> <binary> <binary> ...
#
# where <channel> is matched against JARVIS_CD_CHANNEL (injected per-VM into
# /etc/hatch/env by hatch-image's hatch-init, reaching launch-daemon.sh via the
# runtime-cell unit's EnvironmentFile=). launch-daemon.sh overlays only the binaries
# revealed for the VM's channel onto the base bin, so the cell sees one merged
# /opt/hatch/bin = core + revealed; every other gated binary is physically absent
# from the cell (carved from the cell bin at build, not revealed).
#
# NOTE: revealed binaries appear merged FLAT in /opt/hatch/bin (not a subfolder), so a
# bare-name invocation resolves a revealed CLI via the existing PATH. Privsep host-slice
# tools (whose systemd worker resolves the binary on the HOST) are provisioned separately
# and are NOT covered by this cell-side reveal.
#
# Semantics (see launch-daemon.sh for the authoritative gate):
#   - '#' comments and blank lines are ignored; a trailing '#' comment on a
#     channel line is stripped.
#   - An unset/unknown JARVIS_CD_CHANNEL, or a missing channel line here, reveals
#     nothing: no gated binary is merged in and the cell bin is the base set only.
#     Never fail open.
#   - Channel names/values are owned by the CD control plane, not this repo.
#   - A binary listed here MUST be a real staged hatch-extensions CLI (core
#     binaries are never gate-able). The build enforces only this, fail-closed,
#     via scripts/_bin_scoped_plan.py.
#   - Gating is INDEPENDENT of skill gating: a binary is revealed purely by this
#     file, regardless of whether any skill is base, gated, or revealed. Carving
#     a gated binary out of the cell bin removes it on every non-revealing
#     channel, so DO NOT gate a binary an always-present (base/core) skill needs.
#     The build does NOT cross-check that -- bins and skills are independent axes
#     -- so when gating a connector, address its skill on the skill axis too.
#
# No channels are active by default: with no lines below, the gated set is empty
# and the bin gate is dormant. Add one line per channel to reveal binaries, e.g.:
#   prerelease  experimental-cli another-cli
#   canary      experimental-cli
# ads-mcp, audio-notes-read, navigation, and polymarket-api remain gated to
# internal-test. WhatsApp Companion's hatch_wai_cli is scoped to prod, with a
# per-owner rollout GK, matching its skill scopes in extensions_scoped.toml.
# Gating the skill alone
# hides the prompt, not the capability: the extension-CLI union is default-ALLOW,
# so a CLI absent from this file stays on the cell's PATH and runnable on every
# channel, with its Sentinel connector policy live. Each was audited for
# always-present consumers as the contract above requires.
#
# Phone has no cell-side executable: the daemon places calls in-process
# (phone-client), admitted by the per-owner Gatekeeper::Phone rollout gate,
# and its Sentinel, approval, and destination-eligibility boundaries are
# daemon-owned. Nothing to scope here.
#
# This carve is cell-side only. All five below are privsep tools, so each HOST
# copy at /opt/hatch/bin/<name> and its worker stay in place on every channel
# -- see the SCOPE note above. Hiding the cell binary is visibility gating, not
# a capability boundary.
internal-test  ads-mcp audio-notes-read navigation polymarket-api
prod          hatch_wai_cli
